name: CI
on: [push, pull_request]
permissions:
  # Allow the reusable publisher; its build jobs restrict themselves to read.
  contents: write
  packages: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apps:
    uses: ./.github/workflows/build-apps.yml
    secrets: inherit
