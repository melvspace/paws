appId: dev.paws.desktop
productName: Paws
icon: ../../assets/icon.png
directories:
  output: ../../release/desktop
files:
  - src/main.mjs
  - src/runtimeSetup.mjs
  - package.json
extraResources:
  - from: dist
    to: runtime
asar: true
artifactName: Paws-${version}-${os}-${arch}.${ext}
mac:
  category: public.app-category.developer-tools
  identity: "-"
  hardenedRuntime: false
  notarize: false
  # Preserve Lima's virtualization entitlements when signing the outer app.
  signIgnore:
    - /runtime/containers/lima/
  target: dmg
linux:
  executableName: paws
  syncDesktopName: true
  maintainer: Paws contributors
  category: Development
  target:
    - AppImage
    - deb
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
